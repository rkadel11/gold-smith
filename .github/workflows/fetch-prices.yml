name: Fetch metal prices

on:
  schedule:
    # Every 2 hours, starting at 06:05 Dubai time (02:05 UTC) -- KT's
    # own page timestamps its morning gold rate as live by ~06:00
    # Dubai time, so :05 past gives it a moment to have posted before
    # we check. The old fixed 10am/2pm/6pm Dubai schedule left the
    # widget showing yesterday's numbers for hours after KT had
    # already updated; every 2 hours picks up whichever slot actually
    # changed within 2 hours of it happening. Also feeds
    # data/source_comparison.jsonl (started 2026-09-18) for an
    # ongoing comparison of KT vs Gulf News vs Dubai City of Gold. The
    # commit step below already only pushes when something changed,
    # so the extra runs are no-ops the rest of the time.
    - cron: "5 */2 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

# Serializes overlapping runs instead of racing -- confirmed
# 2026-09-18: three workflow_dispatch triggers fired within seconds of
# each other (manual taps + the schedule) all checked out the same
# main, and only the fastest push won; the other two died with
# "[rejected] main -> main (fetch first)" and silently dropped their
# fetched data. queue (not cancel), since a queued run still fetches
# fresh data when its turn comes -- more runs/data points is wanted,
# just not racing each other.
concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python3 scripts/fetch_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "metal-price-log bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update prices: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # concurrency: group above should already serialize runs,
            # but retry with a rebase on top of whatever landed in the
            # meantime as a second line of defense, rather than losing
            # this run's fetched data to a rejected push.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt/3), rebasing onto latest main and retrying..."
              git pull --rebase origin main
            done
          else
            echo "No changes to commit."
          fi
