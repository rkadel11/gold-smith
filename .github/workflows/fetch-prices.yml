name: Fetch metal prices

on:
  schedule:
    # Every 2 hours, all day (UTC). KT's own page timestamps its
    # morning gold rate as live by ~06:00 Dubai time (02:00 UTC) --
    # well before the old fixed 10am/2pm/6pm Dubai schedule ever
    # checked -- so a fixed 3x/day schedule left the widget showing
    # yesterday's numbers for hours after KT had already updated.
    # Polling every 2 hours instead means whichever slot KT actually
    # updates in gets picked up within 2 hours of it happening. The
    # commit step below already only pushes when something changed,
    # so the extra runs are no-ops the rest of the time.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python3 scripts/fetch_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "metal-price-log bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update prices: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to commit."
          fi
